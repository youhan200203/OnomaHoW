exp_name: "onomacap_htsat_bart_jamo_factor_dual_cross_attn_curriculum_bf16_sharedsplit_compactvocab71_v1"
device: "cuda"
pretrain: true
pretrain_strict: false
pretrain_path: "/content/drive/MyDrive/OnomaCap/checkpoints/onomacap_htsat_bart_jamo_bf16_sharedsplit_compactvocab71_v1_lr_3e-05_batch_16_seed_20/best_model.pt"
seed: 20

audio_args:
  sr: 32000
  n_fft: 1024
  hop_length: 320
  f_min: 50
  f_max: 14000
  n_mels: 64
  max_length: 0
  mono: true

data_args:
  dataset: "OnomaCap"
  batch_size: 16
  num_workers: 4

audio_encoder_args:
  model_arch: "transformer"
  model_name: "htsat"
  pretrained: true
  freeze: false
  spec_augment: true

text_decoder_args:
  name: "facebook/bart-base"
  pretrained: false
  compact_jamo_vocab: true
  max_length: 80

factor_args:
  enabled: true
  path: "/content/drive/MyDrive/OnomaCap/features/onomacap_acoustic_factors.npz"
  names: ["brightness", "roughness", "onset", "sustain", "offset", "noise"]
  window_ms: 200
  hop_ms: 100
  dropout: 0.1
  audio_modality_dropout: 0.2
  factor_only_epochs: 10
  audio_dropout_transition_epochs: 3

optim_args:
  scheduler: "cosine"
  lr: !!float 3e-5
  optimizer_name: "adamw"
  betas: [0.9, 0.999]
  eps: !!float 1e-8
  momentum: 0.9
  gamma: 0.1
  warmup_epochs: 1
  step_epochs: 10
  weight_decay: !!float 1e-6

training:
  epochs: 20
  clip_grad: 2
  dropout: 0.2
  precision: "bf16"
  checkpoint_root: "/content/drive/MyDrive/OnomaCap/checkpoints"

evaluation:
  beam_size: 3

results:
  root: "/content/drive/MyDrive/OnomaCap/results"
